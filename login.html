<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alok Raj">
    <title>Login - winGOO</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 36px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .remember-forgot a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }

        .remember-forgot a:hover {
            color: #764ba2;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            color: #7f8c8d;
            font-size: 14px;
            position: relative;
        }

        .google-signin {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .google-signin-btn {
            background: white;
            border: 1px solid #e0e0e0;
            padding: 12px 20px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }

        .google-signin-btn:hover {
            background: #f8f9fa;
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .google-signin-btn img {
            width: 20px;
            height: 20px;
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            color: #7f8c8d;
            font-size: 14px;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .signup-link a:hover {
            color: #764ba2;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #764ba2;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            .logo {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <div class="login-header">
            <div class="logo"><a href="index.html">winGOO</a></div>
            <p>Sign in to your account</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="remember-forgot">
                <label style="margin: 0; font-weight: 400;">
                    <input type="checkbox" style="margin-right: 5px;"> Remember me
                </label>
                <a href="forgot-password.html">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="divider">
            <span>Or continue with</span>
        </div>

        <div class="google-signin">
            <div id="g_id_onload"
                 data-client_id="637556644945-40jv5c34fea7h9pllepvhhcjl2e41iek.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard"></div>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign up here</a>
        </div>
    </div>

    <script>
        // Google OAuth Callback Function
        function handleCredentialResponse(response) {
            try {
                // Decode the JWT token
                const responsePayload = decodeJwtResponse(response.credential);
                
                console.log("ID: " + responsePayload.sub);
                console.log('Full Name: ' + responsePayload.name);
                console.log('Email: ' + responsePayload.email);
                
                // Store user info in localStorage
                localStorage.setItem('user', JSON.stringify({
                    name: responsePayload.name,
                    email: responsePayload.email,
                    picture: responsePayload.picture
                }));

                // Check if user role exists, if not ask for it
                let userRole = localStorage.getItem('userRole');
                if (!userRole) {
                    // Simple role selection for demo purposes
                    // In a real app, this would be a nice modal or a separate onboarding step
                    // For now, let's look for a stored preference or default to buyer
                    
                    // Let's simulate a role check or prompt
                    // Since we can't easily do a modal without adding HTML, let's use a native confirm/prompt approach
                    // or just default to buyer and let them switch.
                    
                    // Better approach: Redirect to a role selection page or handle it here?
                    // Let's create a simple overlay to ask for role if not set.
                    showRoleSelectionModal();
                    return; 
                }

                // Redirect to specific dashboard
                redirectToDashboard(userRole);

            } catch (e) {
                console.error("Error processing login:", e);
                showError('An error occurred during login');
            }
        }

        function redirectToDashboard(role) {
            if (role === 'seller') window.location.href = 'dashboard-seller.html';
            else if (role === 'agent') window.location.href = 'dashboard-agent.html';
            else window.location.href = 'dashboard-buyer.html';
        }

        function showRoleSelectionModal() {
            // Create a modal dynamically
            const modal = document.createElement('div');
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:9999;';
            modal.innerHTML = `
                <div style="background:white;padding:30px;border-radius:10px;text-align:center;max-width:400px;width:90%;">
                    <h2>Select Account Type</h2>
                    <p style="margin:10px 0 20px;">Please select how you want to use winGOO:</p>
                    <div style="display:flex;flex-direction:column;gap:10px;">
                        <button onclick="selectRole('buyer')" style="padding:10px;background:#667eea;color:white;border:none;border-radius:5px;cursor:pointer;">I want to Buy/Rent</button>
                        <button onclick="selectRole('seller')" style="padding:10px;background:#3498db;color:white;border:none;border-radius:5px;cursor:pointer;">I want to Sell/Lease</button>
                        <button onclick="selectRole('agent')" style="padding:10px;background:#11998e;color:white;border:none;border-radius:5px;cursor:pointer;">I am an Agent</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            window.selectRole = function(role) {
                localStorage.setItem('userRole', role);
                document.body.removeChild(modal);
                redirectToDashboard(role);
            };
        }

        // Helper function to decode JWT token
        function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        }

        // Traditional Email Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Validate inputs
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }

            // Send login request to backend (Simulation)
                // For demo/static site, we simulate login success
                // In a real backend, you'd verify credentials
                
                // Simulate success
                localStorage.setItem('user', JSON.stringify({
                    name: 'User',
                    email: email
                }));
                
                // Check local storage for role or default to buyer
                let userRole = localStorage.getItem('userRole');
                if(!userRole) {
                    // If manually logging in, maybe we assume they are a buyer or check previous signup
                    // For now, show the same role selection
                    showRoleSelectionModal();
                } else {
                    redirectToDashboard(userRole);
                }

/*             fetch('backend/login.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Store auth token and redirect
                    localStorage.setItem('authToken', data.token);
                    window.location.href = 'dashboard.html';
                } else {
                    showError(data.message || 'Login failed');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('An error occurred during login');
            }); */
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Window object for Google Sign-In
        window.onload = function() {
            google.accounts.id.initialize({
                client_id: '637556644945-40jv5c34fea7h9pllepvhhcjl2e41iek.apps.googleusercontent.com',
                callback: handleCredentialResponse
            });
        };
    </script>
    <script src="script.js"></script>
</body>
</html>
