<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Dashboard - winGOO</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        .sidebar h2 {
            margin-bottom: 30px;
        }
        .sidebar ul {
            list-style: none;
        }
        .sidebar ul li {
            margin-bottom: 15px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .sidebar a:hover {
            background: rgba(255,255,255,0.2);
        }
        .main-content {
            flex: 1;
            padding: 40px;
            background: #f4f7f6;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .stat-card h3 {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .stat-card p {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2 onclick="window.location.href='index.html'" style="cursor:pointer;">winGOO</h2>
            <nav>
                <ul>
                    <li><a href="#" class="active">Dashboard</a></li>
                    <li><a href="properties.html">Browse Properties</a></li>
                    <li><a href="#">Saved Homes</a></li>
                    <li><a href="#">Saved Searches</a></li>
                    <li><a href="#">Messages</a></li>
                    <li><a href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </nav>
        </aside>
        
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h1>Welcome Back, <span id="userName">Buyer</span>!</h1>
                <div class="user-profile">
                    <img id="userPic" src="" alt="" style="width: 40px; height: 40px; border-radius: 50%; display: none;">
                </div>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Saved Properties</h3>
                    <p>12</p>
                </div>
                <div class="stat-card">
                    <h3>Recent Views</h3>
                    <p>45</p>
                </div>
                <div class="stat-card">
                    <h3>New Matches</h3>
                    <p>8</p>
                </div>
            </div>

            <section class="recent-activity">
                <h2>Recommended For You</h2>
                <div class="properties-grid" style="grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); margin-top: 20px;">
                    <!-- Placeholder Card 1 -->
                    <div class="property-card" style="background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                        <div style="height: 150px; background: #ddd;"></div>
                        <div style="padding: 15px;">
                            <h4>Modern Apartment</h4>
                            <p>₹45 Lakhs</p>
                            <button class="btn btn-sm" style="margin-top: 10px;">View</button>
                        </div>
                    </div>
                    <!-- Placeholder Card 2 -->
                    <div class="property-card" style="background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                        <div style="height: 150px; background: #ddd;"></div>
                        <div style="padding: 15px;">
                            <h4>Cosy Villa</h4>
                            <p>₹85 Lakhs</p>
                            <button class="btn btn-sm" style="margin-top: 10px;">View</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Check for login
        const userStr = localStorage.getItem('user');
        if (!userStr) {
            window.location.href = 'login.html';
        } else {
            const user = JSON.parse(userStr);
            document.getElementById('userName').textContent = user.name;
            if(user.picture) {
                const img = document.getElementById('userPic');
                img.src = user.picture;
                img.style.display = 'block';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('user');
            localStorage.removeItem('authToken');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
